appId: com.watchcrew.app
---
# onboarding-explore.yaml — non-destructive tour of the onboarding forms.
# Only meaningful for an account WITHOUT a group. For the normal test account
# (has "Maestro Test Gruppe") the guarded block is skipped and the flow passes
# after asserting the Tracker tab. Creates/joins nothing.
- runFlow: ../subflows/ensure-app.yaml
- runFlow:
    when:
      visible: "Willkommen bei WatchCrew"
    commands:
      - takeScreenshot: 01-onboarding-select
      - tapOn: "Gruppe erstellen"
      - assertVisible: "Gruppenname"
      - assertVisible: "Farbthema"
      - takeScreenshot: 02-onboarding-create-form
      - tapOn: "Zurück"
      - assertVisible: "Gruppe beitreten"
      - tapOn: "Gruppe beitreten"
      - assertVisible: "Einladungscode / Gruppen-ID"
      - takeScreenshot: 03-onboarding-join-form
      - tapOn: "Zurück"
      - assertVisible: "Gruppe erstellen"
- runFlow:
    when:
      visible: "Tracker"
    commands:
      - assertVisible: "Tracker"
