appId: com.watchcrew.app
---
# movie-collection.yaml — "Filmreihe" screen from The Dark Knight (Batman
# collection). Read-only.
- runFlow: ../subflows/ensure-app.yaml
- runFlow: ../subflows/go-tagebuch.yaml
- extendedWaitUntil:
    visible:
      id: "tagebuch-entry-press-.*"
    timeout: 15000
- tapOn: "The Dark Knight"
- extendedWaitUntil:
    visible:
      id: "movie-detail-title"
    timeout: 15000
- takeScreenshot: 01-dark-knight-detail
- tapOn:
    id: "movie-detail-action-filmreihe"
- extendedWaitUntil:
    visible:
      id: "collection-screen-grid"
    timeout: 20000
- runFlow:
    file: ../subflows/shot.yaml
    env:
      NAME: 02-collection-screen
- back
- extendedWaitUntil:
    visible:
      id: "movie-detail-title"
    timeout: 10000
- back
- extendedWaitUntil:
    visible:
      id: "tagebuch-screen"
    timeout: 10000
