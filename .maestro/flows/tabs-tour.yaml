appId: com.watchcrew.app
---
# tabs-tour.yaml — tabs (labels; icons have no testIDs), Settings hub and its
# sub-screens (headers), Group-Settings. Read-only. PRECONDITION: account has
# a group. Each sub-screen is left via hardware back.
- runFlow: ../subflows/ensure-app.yaml
# go-<tab> point-taps the tab and asserts its screen testID, so each shot is
# the intended tab (previously 01 showed the Watchlist: "Tracker" text matched
# the tab label on any tab).
- runFlow: ../subflows/go-tracker.yaml
- assertVisible:
    id: "tracker-group-settings-button"
- takeScreenshot: 01-tab-tracker
# Header brand = group quick-switch button. Only asserted, NEVER tapped: the dev account has
# several groups, a tap would change the persisted active group (side effect).
- assertVisible:
    id: "app-header-brand-button"
- runFlow: ../subflows/go-watchlist.yaml
- takeScreenshot: 02-tab-watchlist
- runFlow: ../subflows/go-tagebuch.yaml
- takeScreenshot: 03-tab-tagebuch
- runFlow: ../subflows/go-tracker.yaml
- tapOn:
    id: "tracker-group-settings-button"
- extendedWaitUntil:
    visible: "Einstellungen"
    timeout: 10000
- assertVisible:
    id: "settings-screen"
- scrollUntilVisible:
    element:
      id: "settings-attributions"
- assertVisible:
    id: "settings-attributions"
- scrollUntilVisible:
    element:
      id: "settings-sign-out-button"
- assertVisible: "Abmelden"
- takeScreenshot: 04-settings-hub
- scrollUntilVisible:
    element:
      id: "settings-section-streaming-services"
    direction: UP

- tapOn:
    id: "settings-section-streaming-services"
- extendedWaitUntil:
    visible: "Meine Streaming-Dienste"
    timeout: 10000
- assertVisible:
    id: "settings-streaming-screen"
- back

- tapOn:
    id: "settings-section-display"
- extendedWaitUntil:
    visible: "Darstellung"
    timeout: 10000
- assertVisible:
    id: "settings-display-screen"
- back

- tapOn:
    id: "settings-section-notifications"
- extendedWaitUntil:
    visible: "Benachrichtigungen"
    timeout: 10000
- assertVisible:
    id: "settings-notifications-screen"
- back

- tapOn:
    id: "settings-section-group-settings"
- extendedWaitUntil:
    visible: "Mitglieder"
    timeout: 10000
- assertVisible:
    id: "group-settings-screen"
- takeScreenshot: 05-group-settings
