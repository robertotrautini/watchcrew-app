appId: com.watchcrew.app
---
# watchlist-filter-sort.yaml — Watchlist tab: search, collapsible filter panel
# with the DECOUPLED rows (no labels; sort icon + field Select + direction button;
# row 3: "+ Filter" + scrollable chips + view-mode toggle at the right; flyout with draft/Anwenden/Zurücksetzen),
# combination filter + sort, static table header (sort only via the panel),
# filter dot, all 3 view modes.
# Restores: sort "Hinzugefügt" descending, no filters, view mode grid, panel
# closed (subflows/watchlist-normalize.yaml).
- runFlow: ../subflows/ensure-app.yaml
- runFlow: ../subflows/go-watchlist.yaml
- extendedWaitUntil:
    visible:
      id: "watchlist-screen"
    timeout: 15000
# Persisted sort/filters/panel state is NOT trusted: normalise to the app
# default before the first shot.
- runFlow: ../subflows/watchlist-normalize.yaml
- takeScreenshot: 01-watchlist-default-closed

# --- search ---
- tapOn:
    id: "watchlist-search-input"
- inputText: "Incep"
- hideKeyboard
- takeScreenshot: 02-watchlist-search-match
- eraseText
- inputText: "zzzzqq"
- hideKeyboard
- assertVisible:
    id: "watchlist-no-results"
- takeScreenshot: 03-watchlist-search-no-results
- tapOn:
    id: "watchlist-search-input"
- eraseText
- hideKeyboard

# --- panel open: row 2 sort, row 3 filter + view mode ---
- tapOn:
    id: "watchlist-filter-toggle"
- assertVisible:
    id: "watchlist-filter-panel"
- assertVisible:
    id: "watchlist-sort-field"
- assertVisible:
    id: "watchlist-sort-direction"
- assertVisible:
    id: "watchlist-filter-add"
- takeScreenshot: 04-watchlist-panel-open

# --- sort fields (Select) + direction; filters stay untouched ---
- tapOn:
    id: "watchlist-sort-field"
- assertVisible:
    id: "watchlist-sort-field-list"
- takeScreenshot: 05-watchlist-sort-field-select
- tapOn:
    id: "watchlist-sort-field-option-tmdb"
- assertNotVisible:
    id: "watchlist-sort-field-list"
- takeScreenshot: 06-watchlist-sort-tmdb-desc
- tapOn:
    id: "watchlist-sort-direction"
- takeScreenshot: 07-watchlist-sort-tmdb-asc
- tapOn:
    id: "watchlist-sort-field"
- tapOn:
    id: "watchlist-sort-field-option-title"
- takeScreenshot: 08-watchlist-sort-title-asc
- tapOn:
    id: "watchlist-sort-field"
- tapOn:
    id: "watchlist-sort-field-option-release"
- takeScreenshot: 09-watchlist-sort-release
- tapOn:
    id: "watchlist-sort-field"
- tapOn:
    id: "watchlist-sort-field-option-added"
- takeScreenshot: 10-watchlist-sort-added

# --- filter flyout: opens with all sections; nothing applies before Anwenden ---
- tapOn:
    id: "watchlist-filter-add"
- extendedWaitUntil:
    visible:
      id: "watchlist-filter-flyout"
    timeout: 5000
- assertVisible:
    id: "watchlist-genre-pills"
- assertVisible:
    id: "watchlist-year-pills"
- assertVisible:
    id: "watchlist-streaming-mine"
- assertVisible:
    id: "watchlist-filter-liked"
- takeScreenshot: 11-watchlist-flyout-open
- tapOn:
    id: "watchlist-genre-pill-.*"
    index: 0
- takeScreenshot: 12-watchlist-flyout-genre-draft
- tapOn:
    id: "watchlist-filter-apply"
- assertNotVisible:
    id: "watchlist-filter-flyout"
- assertVisible:
    id: "watchlist-filter-chip-genre-.*"
- assertVisible:
    id: "watchlist-filter-active-dot"
- takeScreenshot: 13-watchlist-genre-chip

# --- combination: genre filter + tmdb sort (decoupled) ---
- tapOn:
    id: "watchlist-sort-field"
- tapOn:
    id: "watchlist-sort-field-option-tmdb"
- assertVisible:
    id: "watchlist-filter-chip-genre-.*"
- takeScreenshot: 14-watchlist-genre-plus-tmdb-sort
- tapOn:
    id: "watchlist-filter-chip-genre-.*"
- assertNotVisible:
    id: "watchlist-filter-chip-genre-.*"
- takeScreenshot: 15-watchlist-genre-chip-removed

# --- year + rating-state filters in the flyout ---
- tapOn:
    id: "watchlist-filter-add"
- tapOn:
    id: "watchlist-year-pill-.*"
    index: 0
- tapOn:
    id: "watchlist-filter-has_ratings"
- takeScreenshot: 16-watchlist-flyout-year-has-ratings-draft
- tapOn:
    id: "watchlist-filter-apply"
- assertVisible:
    id: "watchlist-filter-chip-year"
- assertVisible:
    id: "watchlist-filter-chip-has_ratings"
- takeScreenshot: 17-watchlist-year-has-ratings-chips
- tapOn:
    id: "watchlist-filter-add"
- tapOn:
    id: "watchlist-filter-upcoming"
- tapOn:
    id: "watchlist-filter-unrated"
- tapOn:
    id: "watchlist-filter-apply"
- takeScreenshot: 18-watchlist-upcoming-unrated-chips

# --- streaming filter (Meine Dienste + Flatrate/Leihen/Kaufen) ---
- tapOn:
    id: "watchlist-filter-add"
- tapOn:
    id: "watchlist-filter-reset"
- tapOn:
    id: "watchlist-streaming-mine"
- assertVisible:
    id: "watchlist-provider-categories"
- takeScreenshot: 19-watchlist-flyout-streaming-draft
- tapOn:
    id: "watchlist-provider-category-rent"
- tapOn:
    id: "watchlist-provider-category-rent"
- tapOn:
    id: "watchlist-filter-apply"
- assertVisible:
    id: "watchlist-filter-chip-streaming"
- takeScreenshot: 20-watchlist-streaming-chip

# --- reset in the flyout clears all filters (apply) ---
- tapOn:
    id: "watchlist-filter-add"
- tapOn:
    id: "watchlist-filter-reset"
- tapOn:
    id: "watchlist-filter-apply"
- assertNotVisible:
    id: "watchlist-filter-chip-streaming"
- takeScreenshot: 21-watchlist-filters-reset

# --- view modes (all share the same sort) ---
- tapOn:
    id: "watchlist-view-mode-cards-button"
- assertVisible:
    id: "watchlist-grid-or-cards"
- takeScreenshot: 22-watchlist-view-cards
- tapOn:
    id: "watchlist-view-mode-list-button"
- assertVisible:
    id: "watchlist-list"
- takeScreenshot: 23-watchlist-view-list

# --- table header is static (sorting only via the panel) ---
- assertVisible:
    id: "watchlist-table-header"
- takeScreenshot: 24-watchlist-list-static-header
- tapOn:
    id: "watchlist-view-mode-grid-button"
- assertVisible:
    id: "watchlist-grid-or-cards"
- takeScreenshot: 26-watchlist-view-grid

# --- restore: sort default, no filters, panel closed ---
- runFlow: ../subflows/watchlist-normalize.yaml
- takeScreenshot: 27-watchlist-restored-closed
