appId: com.watchcrew.app
---
# movie-detail.yaml — reaches the Add-Movie modal (src/app/(app)/(modals)/
# add-movie.tsx) via the Watchlist tab's "+" button, searches for a known
# film, and opens its Movie-Detail-Overlay (src/app/(app)/(modals)/movie/
# [tmdbId].tsx) to screenshot it.
#
# PRECONDITION: same as tabs-tour.yaml — the signed-in account needs an
# active Watch-Group to reach the Watchlist tab at all. Also depends on the
# TMDB search proxy being reachable from the device (real network call, not
# mocked) — if the search comes back empty this flow fails at the
# assertVisible for the movie title, which is itself the honest result to
# report rather than something to force past.
#
# The "add to watchlist for real" section below (steps 04+) was added in the
# same session as create-test-group.yaml but is UNVERIFIED by an actual run
# — the Maestro test account never reached a group-having state in that
# session (real, reproducible backend blocker: create_watch_group RPC
# missing from the Supabase dev project's PostgREST schema cache — see that
# session's report), so this flow could never even get past its own
# PRECONDITION. The "Zur Watchlist" testID is real (src/components/movie/
# MovieDetailActionsBar.tsx's `movie-detail-action-${id}` pattern with
# id "zur_watchlist", confirmed reachable for a tmdbId opened WITHOUT
# groupId/source route params — exactly how add-movie.tsx's film-search
# `handlePressItem` navigates here when the tapped movie isn't already in
# the group's library — via src/lib/movieDetailLogic.ts's
# `getVisibleActionsWithoutGroupContext`), but the back-navigation-then-
# revisit-Watchlist steps are an untested guess at the right shape and may
# need adjustment once this can actually run.

- runFlow: ../subflows/launch.yaml

- tapOn: "Watchlist"
- extendedWaitUntil:
    visible:
      id: "watchlist-add-movie-button"
    timeout: 10000
# Let any toast settle/disappear before tapping.
- waitForAnimationToEnd
- tapOn:
    id: "watchlist-add-movie-button"
- extendedWaitUntil:
    visible: "Filmtitel suchen…"
    timeout: 10000
- takeScreenshot: 01-add-movie-search

- tapOn:
    id: "add-movie-film-search-input"
- inputText: "Inception"
- extendedWaitUntil:
    visible: "Inception"
    timeout: 10000
- takeScreenshot: 02-add-movie-results

- tapOn: "Inception"
- extendedWaitUntil:
    visible: "Inception"
    timeout: 10000
- takeScreenshot: 03-movie-detail-overlay

# --- Add to watchlist for real (exercises upsert_movie + addToWatchlist) ---
# UNVERIFIED (see header comment).
# Idempotent: when the movie is NOT yet on the watchlist the overlay opens
# without group context and offers "zur_watchlist" -> tap it. When it is
# already on the watchlist (re-run with the same account) the overlay opens
# with watchlist context (add-movie.tsx `handlePressItem` passes groupId +
# source) and that action is absent, so the add step is skipped instead of
# failing the flow.
- runFlow:
    when:
      visible:
        id: "movie-detail-action-zur_watchlist"
    commands:
      - tapOn:
          id: "movie-detail-action-zur_watchlist"
      # handleAddToWatchlist (MovieDetailActionsBar.tsx) has no onSuccess
      # navigation/toast wired for this specific button (unlike
      # "direkt_bewerten") -- give the mutation a moment to land before
      # navigating away, so the Watchlist-tab re-check below isn't racing
      # the write.
      - extendedWaitUntil:
          visible: "Zur Watchlist"
          timeout: 10000
- takeScreenshot: 04-after-add-to-watchlist-tap

# movie-detail.tsx has headerShown:false with its own manual back button
# (testID movie-detail-back-button); add-movie.tsx uses the (modals) group's
# default native Stack header instead (no stable testID to target) -- the
# Android hardware back gesture is the one mechanism that reliably works for
# both, so it's used here instead of guessing a native header back-button
# selector.
- back
- back
- extendedWaitUntil:
    visible:
      id: "watchlist-screen"
    timeout: 10000
- takeScreenshot: 05-watchlist-with-real-entry
